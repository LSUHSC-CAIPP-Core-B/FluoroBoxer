name: Python Compatibility

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

  tfrecord-smoke:
    runs-on: ubuntu-latest
    env:
      MPLCONFIGDIR: /tmp/matplotlib
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install TFRecord dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-tfrecord.txt

      - name: Prepare smoke-test inputs
        run: |
          mkdir -p /tmp/tfrecord-smoke/xml /tmp/tfrecord-smoke/images
          cp Data/final_Data_set/xml_outputs/VID856_B4_1_00d10h00m_19_0.xml /tmp/tfrecord-smoke/xml/
          cp Data/final_Data_set/images/val/VID856_B4_1_00d10h00m_19_0.png /tmp/tfrecord-smoke/images/

      - name: Run TFRecord smoke test
        run: |
          python convert_xml_to_tfrecord.py \
            --xml_dir /tmp/tfrecord-smoke/xml \
            --labels_path ./labels.pbtxt \
            --output_path /tmp/tfrecord-smoke/smoke.record \
            --image_dir /tmp/tfrecord-smoke/images
